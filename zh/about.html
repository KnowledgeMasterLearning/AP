<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于我 | Knowledge Master</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Knowledge Master</a>
      <nav>
        <a href="index.html">首页</a>
        <a href="courses.html">课程</a>
        <a href="about.html" class="active">关于我</a>
        <a href="../en/index.html" class="lang-switch">EN</a>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="about-card">

        <img class="avatar"
             src="https://api.dicebear.com/7.x/initials/svg?seed=KM&backgroundColor=660099"
             alt="头像">

        <h2>你的名字</h2>
        <p class="title">AP 课程教师 · XX 学校</p>

        <p class="bio">
          【个人介绍占位】这里将介绍你的教学经历、教学理念，
          以及做这个网站的初衷。
        </p>

        <div class="contact-list">
          <a href="mailto:your@email.com">✉️ 邮箱</a>
          <a href="#" id="wechatBtn">💬 微信</a>
          <a href="https://space.bilibili.com/457613168" target="_blank" rel="noopener">📺 B站</a>
        </div>

      </div>
    </div>
  </section>

  <!-- ===== 微信二维码弹窗 ===== -->
  <div id="wechatModal">
    <div class="wechat-box">
      <img src="../images/wechat-qr.png" alt="微信二维码">
      <p>扫码添加微信</p>
      <button id="wechatClose">关闭</button>
    </div>
  </div>

  <footer>
    <div class="container">
      © 2025 Knowledge Master | 学者同行 · 保留所有权利<br>
      本站内容免费供学习使用，未经许可不得转载或商用。
    </div>
  </footer>

  <!-- ===== 弹窗样式 ===== -->
  <style>
    #wechatModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    #wechatModal.show {
      display: flex;
    }
    .wechat-box {
      background: #fff;
      padding: 30px 36px;
      border-radius: 16px;
      text-align: center;
      max-width: 320px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .wechat-box img {
      width: 220px;
      height: 220px;
      object-fit: contain;
      border-radius: 10px;
    }
    .wechat-box p {
      margin-top: 14px;
      color: #64748b;
      font-size: 0.95rem;
    }
    .wechat-box button {
      margin-top: 18px;
      padding: 9px 28px;
      border: none;
      background: #660099;
      color: #fff;
      border-radius: 8px;
      font-size: 0.92rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .wechat-box button:hover {
      background: #4a0072;
    }
  </style>

  <!-- ===== 弹窗脚本 ===== -->
  <script>
    const wechatBtn = document.getElementById('wechatBtn');
    const wechatModal = document.getElementById('wechatModal');
    const wechatClose = document.getElementById('wechatClose');

    wechatBtn.addEventListener('click', function(e) {
      e.preventDefault();
      wechatModal.classList.add('show');
    });

    wechatClose.addEventListener('click', function() {
      wechatModal.classList.remove('show');
    });

    /* 点遮罩层也能关闭 */
    wechatModal.addEventListener('click', function(e) {
      if (e.target === wechatModal) {
        wechatModal.classList.remove('show');
      }
    });
  </script>

</body>
</html>
